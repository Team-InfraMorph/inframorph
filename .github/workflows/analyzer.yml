name: Analyzer tests

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    paths:
      - 'analyzer/**'
      - 'code_patch/**'
      - 'control_plane/**'
      - 'schemas/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/analyzer.yml'

permissions:
  contents: read

jobs:
  analyzer:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0 # Evidence comparison executes the frozen 1.0.0 checker.
          persist-credentials: false
      - name: Validate branch and PR body for every base branch
        run: python3 scripts/repo_policy.py --event "$GITHUB_EVENT_PATH"
      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Test Analyzer, Code Patch and shared contracts without API calls
        run: |
          node --version
          .venv/bin/python -m unittest discover -s tests -v
