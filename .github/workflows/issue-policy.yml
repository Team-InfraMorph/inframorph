name: Issue policy

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/issue-policy.yml'
      - 'scripts/issue_policy.py'

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-policy-${{ github.event.issue.number || 'audit' }}
  cancel-in-progress: false

jobs:
  issue-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check issue and update needs-info label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "issues" ]; then
            python3 scripts/issue_policy.py --event "$GITHUB_EVENT_PATH"
          else
            python3 scripts/issue_policy.py --all
          fi
